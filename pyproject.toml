[project]
name = "erp-001"
version = "0.1.0"
description = "001 — AI-native, fully-local lightweight ERP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "python-dotenv>=1.0",
    "APScheduler>=3.10",
    "httpx>=0.27",            # Ollama client (AI agent + embeddings + vision)
    "python-docx>=1.1",       # ingest .docx company documents into RAG
    "pymupdf>=1.24",          # render PDF invoices to images for vision parsing
    # production DB (dev defaults to sqlite; see core/config.py)
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html"]
