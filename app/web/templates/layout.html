<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}001{% endblock %}</title>
  <!-- NOTE: CDN for dev; a fully-local appliance vendors these assets (DESIGN). -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-slate-100 text-slate-800">
{% if user %}
<div class="flex min-h-screen">
  <aside class="w-56 bg-slate-900 text-slate-200 p-4 space-y-1">
    <div class="text-lg font-bold text-white mb-4">001</div>
    <a href="/" class="block px-3 py-2 rounded hover:bg-slate-700">Dashboard</a>
    <a href="/assistant" class="block px-3 py-2 rounded hover:bg-slate-700">✨ Assistant</a>
    <a href="/fleet" class="block px-3 py-2 rounded hover:bg-slate-700">📥 Inbox</a>
    <a href="/mail" class="block px-3 py-2 rounded hover:bg-slate-700">📨 Mailroom</a>
    <a href="/map" class="block px-3 py-2 rounded hover:bg-slate-700">🗺 Runtime Map</a>
    <a href="/sales" class="block px-3 py-2 rounded hover:bg-slate-700">🧾 Sales</a>
    <a href="/requests" class="block px-3 py-2 rounded hover:bg-slate-700">My Requests</a>
    <a href="/approvals" class="block px-3 py-2 rounded hover:bg-slate-700">Approvals</a>
    <a href="/leave" class="block px-3 py-2 rounded hover:bg-slate-700">🌴 Leave</a>
    <a href="/contracts" class="block px-3 py-2 rounded hover:bg-slate-700">📑 Contracts</a>
    <a href="/budget" class="block px-3 py-2 rounded hover:bg-slate-700">🎯 Budget</a>
    <a href="/policies" class="block px-3 py-2 rounded hover:bg-slate-700">🎚 Autonomy</a>
    <a href="/reports/financials" class="block px-3 py-2 rounded hover:bg-slate-700">Financials</a>
    <a href="/notifications" class="block px-3 py-2 rounded hover:bg-slate-700">
      Notifications <span id="badge" class="ml-1 text-xs bg-rose-500 text-white rounded-full px-2"></span>
    </a>
    <div class="pt-6 text-xs text-slate-400">{{ user.name }} ({{ user.role }})</div>
    <a href="/logout" class="block px-3 py-2 mt-1 rounded hover:bg-slate-700 text-slate-400">Log out</a>
  </aside>
  <main class="flex-1 p-8">{% block content %}{% endblock %}</main>
</div>
<script>
  async function refreshBadge() {
    try {
      const r = await fetch('/notifications/unread'); const d = await r.json();
      const b = document.getElementById('badge');
      b.textContent = d.unread > 0 ? d.unread : ''; b.style.display = d.unread > 0 ? '' : 'none';
    } catch (e) {}
  }
  refreshBadge(); setInterval(refreshBadge, 15000);
</script>
{% else %}
  {% block guest %}{% endblock %}
{% endif %}
</body>
</html>
