{% extends "layout.html" %}
{% block title %}Approvals — 001 ERP{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Approvals inbox</h1>
<div class="space-y-3">
{% for r in pending %}
  <div class="bg-white rounded-xl shadow p-5 flex items-center justify-between">
    <div>
      <div class="font-semibold">{{ r.title }}</div>
      <div class="text-sm text-slate-500">{{ r.request_no }} · {{ r.type }} · ${{ r.total_amount }}</div>
    </div>
    <div class="flex gap-2">
      <form method="post" action="/approvals/{{ r.id }}/approve">
        <button class="bg-emerald-600 text-white rounded px-4 py-2 hover:bg-emerald-700">Approve</button>
      </form>
      <form method="post" action="/approvals/{{ r.id }}/reject">
        <button class="bg-rose-600 text-white rounded px-4 py-2 hover:bg-rose-700">Reject</button>
      </form>
    </div>
  </div>
{% else %}
  <div class="text-slate-400">Nothing awaiting your approval.</div>
{% endfor %}
</div>
{% endblock %}
